<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treact</title>
  <link rel="stylesheet" href="style.css" />
  <script src="index.js"></script>
</head>

<body>
  <section>
    <nav>
      <div class="row nav__row">
        <div class="nav__logo">
          <img class="nav__logo--img" src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" alt="Logo">
          <div class="nav__logo--title">Treact</div>
        </div>
        <div class="nav__links">
          <a class="nav__link" href="#">About</a>
          <a class="nav__link" href="#">Blog</a>
          <a class="nav__link" href="#">Pricing</a>
          <a class="nav__link" href="#">Contact Us</a>
          <a class="nav__link login" href="#">Login</a>
          <a class="nav__link--primary" href="#">Sign Up</a>  
        </div>
        <button class="btn__menu" onclick="openMenu()">

        </button>
      </div>
    </nav>

    <header>
      <div class="conatiner">
        <div class="row">
          <div class="header__description">
            <h1>Beautiful react Templates <span class="purple">for you</span>
            </h1>
            <p class="header__description--para">
              Our templates are easy to set up, understand and customize. Fully modular components with a variety of pages and components.
            </p>
            <div class="header__email">
              <input type="email" class="header__email--input" placeholder="Your E-mail address">
              <button class="header__email--button">Get Started</button>
            </div>
            <p class="header__customer--title">
              Our trusted customers
            </p>
            <img src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" class="header__customers" alt="">
          </div>
          <figure class="header__img--wrapper">
            <img src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" class="header__img" alt="Header Image">
          </figure>
        </div>
      </div>
    </header>
  </section>


</body>
</html>
